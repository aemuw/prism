services:
  postgres:
    image: postgres:16
    container_name: prism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism_dev_password
      POSTGRES_DB: prism_db
    ports:
      - "5432:5432"
    volumes:
      - prism_pgdata:/var/lib/postgresql/data

volumes:
  prism_pgdata: